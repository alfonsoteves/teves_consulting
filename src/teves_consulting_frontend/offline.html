<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Aion Offline</title>
  <meta name="theme-color" content="#ffffff" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <style>
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      box-sizing: border-box;
      color: #111827;
      background: #ffffff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.5;
    }

    main {
      width: min(520px, 100%);
    }

    h1 {
      margin: 0 0 12px;
      font-size: 2rem;
      letter-spacing: 0;
    }

    p {
      margin: 0 0 14px;
      color: #4b5563;
    }

    a {
      display: inline-flex;
      margin-top: 10px;
      color: #111827;
      font-weight: 600;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <main>
    <h1>Aion is offline</h1>
    <p>The application shell may still be available, but answers, sign-in, continuity, and memory require the network.</p>
    <p>No message, memory write, or authenticated action has been queued.</p>
    <a href="/aion.html">Return to Aion</a>
  </main>
</body>
</html>
