<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Operator</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #111315;
      --panel: #171b20;
      --panel-strong: #1a1f26;
      --line: #2c3138;
      --line-strong: #475569;
      --ink: #f8fafc;
      --muted: #9ca3af;
      --blue: #60a5fa;
      --blue-soft: #93c5fd;
      --green: #bbf7d0;
      --green-line: #166534;
      --warn: #fde68a;
      --warn-line: #b45309;
      --rail-width: 1100px;
      --rail-pad: 20px;
      --header-height: 91px;
      --rail-offset: max(var(--rail-pad), calc((100vw - var(--rail-width)) / 2 + var(--rail-pad)));
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.5;
    }

    body.operator-signed-out {
      background: #000000;
      color: #ffffff;
    }

    .operator-login-brand,
    .operator-workspace-brand,
    .operator-login-footer,
    .operator-login-company,
    .operator-login-about {
      display: none;
    }

    body.operator-signed-out .operator-login-brand,
    body.operator-signed-in .operator-workspace-brand {
      position: fixed;
      top: 25px;
      left: var(--rail-offset);
      z-index: 40;
      display: inline-flex;
      color: #ffffff;
    }

    body.operator-signed-in .operator-workspace-brand {
      color: var(--ink);
    }

    .operator-mark {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border: 1px solid currentColor;
      border-radius: 999px;
      background: transparent;
    }

    .operator-mark svg {
      width: 30px;
      height: 30px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.35;
      transform-box: fill-box;
      transform-origin: center;
    }

    body.operator-signed-in .operator-mark svg {
      animation: operatorRotate 8s linear infinite;
    }

    @keyframes operatorRotate {
      to {
        transform: rotate(360deg);
      }
    }

    body.operator-signed-out .operator-login-footer {
      position: fixed;
      right: 0;
      bottom: 25px;
      left: 0;
      z-index: 40;
      display: block;
      color: #d4d4d4;
      font-size: 0.86rem;
    }

    .operator-login-footer-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      width: 100%;
      max-width: var(--rail-width);
      margin: 0 auto;
      padding: 0 var(--rail-pad);
    }

    body.operator-signed-out .operator-login-company,
    body.operator-signed-out .operator-login-about {
      display: block;
      margin: 0;
      color: #d4d4d4;
      text-decoration: none;
      white-space: nowrap;
    }

    body.operator-signed-out .operator-login-about:hover,
    body.operator-signed-out .operator-login-about:focus {
      color: #ffffff;
      text-decoration: underline;
      text-underline-offset: 4px;
    }

    .operator-header {
      position: fixed;
      top: 0;
      right: 0;
      left: 0;
      z-index: 39;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 18px;
      height: var(--header-height);
      padding: 25px var(--rail-offset);
      border-bottom: 1px solid transparent;
      background: transparent;
    }

    body.operator-signed-in .operator-header {
      border-bottom-color: var(--line);
      background: var(--bg);
    }

    body.operator-signed-in {
      padding-top: var(--header-height);
    }

    body.operator-signed-in .operator-header > div {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      padding: 0;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
      border: 0;
    }

    h1 {
      margin: 0;
      font-size: 0.87rem;
      font-weight: 500;
      letter-spacing: 0;
    }

    h2 {
      margin: 0 0 8px;
      color: var(--ink);
      font-size: 1.18rem;
      letter-spacing: 0;
    }

    h3 {
      margin: 0 0 8px;
      color: var(--ink);
      font-size: 1rem;
      letter-spacing: 0;
    }

    p {
      margin: 0;
    }

    button,
    .nav-link {
      border: 1px solid var(--line-strong);
      border-radius: 8px;
      background: #27303a;
      color: var(--ink);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 40px;
      padding: 0 14px;
      text-decoration: none;
      font-weight: 650;
    }

    button:hover,
    button:focus-visible,
    .nav-link:hover,
    .nav-link:focus-visible {
      border-color: var(--blue);
      background: #344150;
      color: #ffffff;
    }

    #authButton,
    .operator-header .nav-link {
      min-height: 36px;
      border: 1px solid #2f3b49;
      background: #151b24;
      color: #ffffff;
      font-size: 0.87rem;
      font-weight: 500;
      line-height: 1.2;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04), 0 8px 22px rgba(0, 0, 0, 0.18);
    }

    button.secondary,
    .nav-link.secondary {
      background: #151b24;
      color: #ffffff;
    }

    .actions {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .operator-content {
      width: 100%;
      max-width: var(--rail-width);
      margin: 0 auto;
      padding: 0 var(--rail-pad) 72px;
    }

    body.operator-signed-out .operator-content {
      padding: 0;
    }

    .status {
      color: var(--muted);
    }

    body.operator-signed-out .status {
      position: fixed;
      top: 50%;
      left: 50%;
      z-index: 20;
      width: min(100% - 48px, 460px);
      transform: translate(-50%, -50%);
      color: #d4d4d4;
      font-size: 0.95rem;
      text-align: center;
    }

    body.operator-signed-in .status {
      margin: 0 0 18px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
    }

    .status.verified {
      border-color: var(--green-line);
      color: var(--green);
      background: rgba(22, 101, 52, 0.16);
    }

    .status.denied {
      border-color: var(--warn-line);
      color: var(--warn);
      background: rgba(180, 83, 9, 0.16);
    }

    .workspace {
      display: none;
    }

    .workspace.is-visible {
      display: block;
    }

    .operator-workspace-nav {
      position: sticky;
      top: calc(var(--header-height) + 12px);
      z-index: 20;
      display: grid;
      gap: 12px;
      margin: 0 0 38px;
      padding: 14px 0;
      border-bottom: 1px solid #263241;
      background: var(--bg);
    }

    .operator-workspace-nav-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .operator-workspace-kicker {
      margin: 0;
      color: var(--blue-soft);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .operator-workspace-title {
      margin: 3px 0 0;
      color: var(--ink);
      font-size: 1.02rem;
      font-weight: 700;
    }

    .operator-workspace-status {
      color: #cbd5e1;
      font-size: 0.9rem;
      text-align: right;
    }

    .operator-view-tabs {
      display: flex;
      align-items: center;
      gap: 18px;
      overflow-x: auto;
      padding: 0 0 4px;
      scrollbar-width: none;
    }

    .operator-view-tabs::-webkit-scrollbar {
      display: none;
    }

    .operator-view-tab {
      flex: 0 0 auto;
      min-height: 0;
      padding: 0 0 5px;
      border: 0;
      border-bottom: 2px solid transparent;
      border-radius: 0;
      background: transparent;
      color: #cbd5e1;
      font-size: 0.9rem;
      font-weight: 600;
    }

    .operator-view-tab:hover,
    .operator-view-tab:focus {
      border-bottom-color: #64748b;
      background: transparent;
      color: var(--ink);
    }

    .operator-view-tab.is-active {
      border-bottom-color: var(--blue);
      color: var(--ink);
    }

    .summary-grid,
    .role-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 14px;
    }

    .panel,
    .role-card {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      padding: 16px;
    }

    .panel {
      margin-top: 14px;
    }

    .hero-panel {
      margin-top: 0;
      border-color: #365f8d;
      background: var(--panel-strong);
    }

    .kicker,
    .meta {
      color: var(--muted);
      font-size: 0.88rem;
    }

    .badge {
      display: inline-flex;
      border: 1px solid rgba(147, 197, 253, 0.35);
      border-radius: 999px;
      padding: 3px 9px;
      background: rgba(96, 165, 250, 0.12);
      color: var(--blue-soft);
      font-size: 0.78rem;
      font-weight: 800;
      margin-top: 10px;
    }

    ul {
      margin: 8px 0 0;
      padding-left: 18px;
    }

    li {
      margin-top: 5px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    th,
    td {
      border-bottom: 1px solid var(--line);
      padding: 10px;
      text-align: left;
      vertical-align: top;
      font-size: 0.92rem;
    }

    th {
      color: #bfdbfe;
      background: #20252b;
      font-weight: 700;
    }

    tr:nth-child(even) td {
      background: #14181d;
    }

    .capture-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 12px;
      margin-top: 12px;
    }

    .capture-field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .capture-field label {
      color: var(--ink);
      font-size: 0.9rem;
      font-weight: 700;
    }

    input,
    textarea {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #1a1d21;
      color: var(--ink);
      font: inherit;
      padding: 10px 12px;
      width: 100%;
      box-sizing: border-box;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    .capture-output {
      background: #070b12;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: #edf5ff;
      overflow-x: auto;
      padding: 14px;
      white-space: pre-wrap;
    }

    @media (max-width: 820px) {
      :root {
        --rail-pad: 18px;
        --header-height: 78px;
      }

      body.operator-signed-out .operator-login-brand,
      body.operator-signed-in .operator-workspace-brand {
        top: 19px;
      }

      .operator-header {
        height: var(--header-height);
        padding-top: 19px;
        padding-bottom: 19px;
      }

      .operator-workspace-nav {
        position: static;
        gap: 10px;
        margin-bottom: 22px;
        padding: 8px 0 12px;
      }

      .operator-workspace-nav-header {
        align-items: center;
      }

      .operator-workspace-title {
        display: none;
      }

      .operator-view-tabs {
        gap: 16px;
        margin: 0 calc(var(--rail-pad) * -1);
        padding-right: var(--rail-pad);
        padding-left: var(--rail-pad);
      }

      .operator-view-tab {
        font-size: 0.87rem;
      }

      table {
        display: block;
        overflow-x: auto;
      }
    }
